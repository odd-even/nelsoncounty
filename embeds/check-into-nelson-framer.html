<!--
  Check Into Nelson — Framer Embed
  --------------------------------
  1. In Framer, add an Embed component (or Custom Code).
  2. Paste everything below this comment into the embed.
  3. Live URL (GitHub Pages):
     https://odd-even.github.io/nelsoncounty/check-into-nelson.html?embed=1

  Notes:
  - Page ships without its own site header/nav (Framer provides that).
  - Bump &v= if Framer caches an old iframe after a deploy.
  - If Framer strips <script>, keep the iframe only — it still works with a tall min-height.
  - Outbound / nelsoncounty.com links break out of the iframe (_blank / _top).
  - In-page #anchors post a scroll request so the Framer parent page moves.
  - Exit-intent location popup is triggered from this parent script in Framer.
-->
<div id="check-into-nelson-embed" style="width:100%;max-width:100%;margin:0;padding:0;">
  <iframe
    id="check-into-nelson-frame"
    src="https://odd-even.github.io/nelsoncounty/check-into-nelson.html?embed=1&v=20260805g"
    title="Check Into Nelson — Stay Longer. Experience More."
    loading="eager"
    referrerpolicy="no-referrer-when-downgrade"
    allow="clipboard-write"
    style="width:100%;border:0;display:block;min-height:3200px;background:#ffffff;"
  ></iframe>
</div>
<script>
  (function () {
    var frame = document.getElementById("check-into-nelson-frame");
    if (!frame) return;
    var HEADER_OFFSET = 96;
    var exitArmed = false;
    var exitShown = false;

    window.setTimeout(function () { exitArmed = true; }, 12000);

    function showExitIntent() {
      if (!exitArmed || exitShown) return;
      if (!frame.contentWindow) return;
      exitShown = true;
      var rect = frame.getBoundingClientRect();
      var viewportTop = Math.max(0, -rect.top);
      var viewportHeight = window.innerHeight || 700;
      try {
        frame.contentWindow.postMessage({
          type: "checkIntoNelsonShowExit",
          viewportTop: viewportTop,
          viewportHeight: viewportHeight
        }, "*");
      } catch (err) {}
    }

    document.addEventListener("mouseout", function (e) {
      if (!exitArmed || exitShown) return;
      if (e.relatedTarget || e.toElement) return;
      if (typeof e.clientY === "number" && e.clientY > 12) return;
      showExitIntent();
    });

    window.addEventListener("message", function (event) {
      var data = event && event.data;
      if (!data || !data.type) return;

      if (data.type === "checkIntoNelsonHeight") {
        var height = Number(data.height);
        if (!height || height < 600) return;
        frame.style.height = Math.ceil(height) + "px";
        return;
      }

      if (data.type === "checkIntoNelsonScrollTo") {
        var y = Number(data.y);
        if (!isFinite(y)) return;
        var rect = frame.getBoundingClientRect();
        var top = window.scrollY + rect.top + y - HEADER_OFFSET;
        window.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
        return;
      }

      if (data.type === "checkIntoNelsonTravelFrom") {
        try {
          if (window.dataLayer && typeof window.dataLayer.push === "function") {
            window.dataLayer.push({
              event: "cin_travel_from",
              travel_from: data.origin
            });
          }
        } catch (err) {}
        try {
          if (typeof window.gtag === "function") {
            window.gtag("event", "cin_travel_from", { travel_from: data.origin });
          }
        } catch (err2) {}
      }
    });
  })();
</script>
