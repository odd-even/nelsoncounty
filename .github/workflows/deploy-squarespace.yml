name: Deploy JSON to Squarespace

on:
  push:
    paths:
      - 'data/*.json'
      # Don't redeploy when the listings.json snapshot from the
      # Google Sheet exporter is refreshed; that file is consumed
      # directly by frontpage_framer.html, not by Squarespace.
      - '!data/listings.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Squarespace
        env:
          SQUARESPACE_TOKEN: ${{ secrets.SQUARESPACE_TOKEN }}
        run: |
          shopt -s nullglob
          for file in data/*.json; do
            # Skip the listings snapshot produced by the Sheet exporter.
            if [ "$(basename "$file")" = "listings.json" ]; then
              echo "Skipping $file (consumed by frontpage_framer, not Squarespace)"
              continue
            fi
            echo "Deploying $file ..."
            curl -X POST "https://api.squarespace.com/1.0/commerce/products" \
              -H "Authorization: Bearer $SQUARESPACE_TOKEN" \
              -H "Content-Type: application/json" \
              -d "@$file"
          done
